name: Aggiorna BOM nel README

on:
  push:
    paths:
      - 'BOM.csv'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clona repository
        uses: actions/checkout@v4

      - name: Converti CSV in Tabella Markdown
        uses: petems/csv-to-markdown-table-action@master
        with:
          file: 'BOM.csv'
          readme: 'README.md'
          comment-tag: 'BOM-TABLE'

      - name: Committa le modifiche
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: aggiorna automaticamente la tabella BOM nel README"
          branch: ${{ github.head_ref || github.ref_name }}
